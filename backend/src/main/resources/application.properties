spring.application.name=demo

# Load local-only secrets (DB password, JWT secret, admin password). This file is
# gitignored and absent in deployed environments, where the values come from env
# vars instead. None of the three has a committed default: a missing value fails
# startup rather than silently falling back to a value that is public in this repo.
# See secret.properties.example for the required keys.
spring.config.import=optional:classpath:secret.properties

# Database (Supabase)
# Override the non-secret values via env vars in any non-local-dev environment.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.cnbznzbyeqkebgjpniud}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.pool-name=HikariCP

# Server
server.port=${PORT:8080}
# Surface ResponseStatusException reasons (e.g. invalid/duplicate class code) to clients.
server.error.include-message=always

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}

# Admin bootstrap (runs only when the admin user does not already exist — see
# DemoApplication.createAdminUser). Changing this does NOT rotate the password
# of an admin account that has already been created.
admin.username=${ADMIN_USERNAME:admin}
admin.email=${ADMIN_EMAIL:admin@example.com}
admin.password=${ADMIN_PASSWORD}

# CORS (frontend origin) — default lives in SecurityConfig.java's @Value;
# override by setting the FRONTEND_URL env var (comma-separated for multiple).

# Logging
logging.level.org.apache.catalina=DEBUG
logging.level.org.springframework.web.filter=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.backend=DEBUG
