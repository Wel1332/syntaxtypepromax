spring.application.name=demo

# Load local-only secrets (DB password, JWT secret, admin password). This file is
# gitignored and absent in deployed environments, where the values come from env
# vars instead. None of the three has a committed default: a missing value fails
# startup rather than silently falling back to a value that is public in this repo.
# See secret.properties.example for the required keys.
spring.config.import=optional:classpath:secret.properties

# Database (Supabase)
# Override the non-secret values via env vars in any non-local-dev environment.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.cnbznzbyeqkebgjpniud}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.pool-name=HikariCP

# Server
server.port=${PORT:8080}
# Surface ResponseStatusException reasons (e.g. invalid/duplicate class code) to clients.
server.error.include-message=always

# JWT
jwt.secret=${JWT_SECRET}
# Token lifetime (ms). Default 12h. There is no refresh-token flow, so a token
# must outlast a full classroom session or students are logged out mid-study;
# 12h covers a school day and halves the old hardcoded 24h. JwtUtil reads this
# (it used to ignore it and hardcode 24h). Lower it via JWT_EXPIRATION once a
# refresh flow exists.
jwt.expiration=${JWT_EXPIRATION:43200000}

# Admin bootstrap (runs only when the admin user does not already exist — see
# DemoApplication.createAdminUser). Changing this does NOT rotate the password
# of an admin account that has already been created.
admin.username=${ADMIN_USERNAME:admin}
admin.email=${ADMIN_EMAIL:admin@example.com}
admin.password=${ADMIN_PASSWORD}

# CORS (frontend origin) — default lives in SecurityConfig.java's @Value;
# override by setting the FRONTEND_URL env var (comma-separated for multiple).

# Logging
# These were all DEBUG, which is expensive on a small instance: Spring Security
# logs the whole filter chain for every request, and Catalina logs per-connection
# detail, so the cost is paid on each call rather than once. Defaults are now
# production-safe; override any of them via env var to debug a live problem, e.g.
# LOG_LEVEL_SECURITY=DEBUG.
logging.level.org.apache.catalina=${LOG_LEVEL_CATALINA:WARN}
logging.level.org.springframework.web.filter=${LOG_LEVEL_WEB_FILTER:WARN}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}
logging.level.com.syntaxtype.demo=${LOG_LEVEL_APP:INFO}

# Caching (see CacheConfig). Short TTL rather than long: the leaderboard is the
# hottest read on the app and the one students watch for their own score, so it
# must go stale for seconds, not minutes. Writes evict it anyway -- the TTL is
# only a backstop for entries no write touches.
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=30s
