# Test-only configuration. Activated by @ActiveProfiles("test").
#
# WHY THIS FILE EXISTS
# --------------------
# Until this was added, @SpringBootTest classes inherited the main
# application.properties and connected to the PRODUCTION Supabase database.
# Verified by running one test and reading the pool log:
#
#   HikariCP - Added connection org.postgresql.jdbc.PgConnection@37fca349
#
# That meant every `mvn test` opened the live database with ddl-auto=update and
# ran real requests against it, including mutating ones the authorization tests
# deliberately expect to succeed (renaming student 101, for instance). In a
# project whose own CONTEXT.md states "the application's score data _is_ the
# research data", a test run that can write to the study database is a defect in
# the same class as the authorization holes, not a style issue.
#
# @DataJpaTest classes were always safe — Spring swaps in an embedded database
# for those automatically. @SpringBootTest gets no such treatment, which is why
# the problem was invisible.
#
# Any new @SpringBootTest MUST carry @ActiveProfiles("test").

spring.datasource.url=jdbc:h2:mem:syntaxtype-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Test-only values for the three secrets. Without these, running the suite would
# require a developer's local secret.properties, so CI could never run it.
# These are throwaway values for an in-memory database and are not credentials.
jwt.secret=test-only-signing-key-not-used-outside-the-test-profile-0123456789
admin.password=test-only-admin-password
admin.username=test-admin
admin.email=test-admin@example.invalid

# The suite asserts on status codes, so Spring Security's per-request debug
# logging is noise that hides real failures.
logging.level.org.springframework.security=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.springframework.web.filter=WARN
